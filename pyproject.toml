[project]
name = "ot-sandbox"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "asyncua>=2.1.0",
    "httpx>=0.28.1",
    "paho-mqtt>=2.1.0",
    "pymodbus>=3.16.1",
    "python-snap7>=3.3.1",
]

[project.scripts]
ot-sandbox = "ot_sandbox:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
